<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cookie Crew Login | OBA Cookies</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="icon"
    type="image/png"
    href="/images/brand/logo.png"
  >

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

  <link
    rel="stylesheet"
    href="/crew/crew.css"
  >

</head>


<body class="crew-login-page">

  <main class="crew-login-shell">

    <section class="crew-login-card">

      <!-- =====================================
           BRAND
      ====================================== -->

      <div class="crew-login-brand">

        <img
          src="/images/brand/logo.png"
          alt="OBA Cookies"
        >

        <div>
          <span class="crew-eyebrow">
            OBA Cookies
          </span>

          <h1>
            Cookie Crew
          </h1>

          <p>
            Crew Operations
          </p>
        </div>

      </div>


      <!-- =====================================
           SIGN IN
      ====================================== -->

      <div
        class="crew-login-heading"
        id="crew-login-heading"
      >
        <h2>
          Sign in
        </h2>

        <p>
          Use your Cookie Crew account to access OBA operations.
        </p>
      </div>


      <form id="crew-login-form">

        <div
          class="modal-status"
          id="login-status"
          aria-live="polite"
        ></div>


        <div class="form-group">

          <label for="crew-email">
            Email
          </label>

          <input
            class="crew-input"
            id="crew-email"
            name="email"
            type="email"
            autocomplete="username"
            required
          >

        </div>


        <div class="form-group">

          <label for="crew-password">
            Password
          </label>

          <input
            class="crew-input"
            id="crew-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          class="crew-button primary crew-login-submit"
          id="crew-login-submit"
          type="submit"
        >
          Sign In
        </button>

      </form>


      <!-- =====================================
           PASSWORD RECOVERY
      ====================================== -->

      <div class="crew-login-recovery">

        <button
          id="crew-forgot-password"
          type="button"
          class="crew-login-recovery-link"
        >
          Forgot password?
        </button>

        <a
          href="/crew/recover-account.html"
          class="crew-login-recovery-link"
        >
          Use a recovery code
        </a>


        <form
          id="crew-recovery-form"
          hidden
        >

          <div
            class="modal-status"
            id="recovery-status"
            aria-live="polite"
          ></div>


          <div class="crew-login-heading">

            <h2>
              Reset password
            </h2>

            <p>
              Enter your Cookie Crew email and we'll send you a password reset link.
            </p>

          </div>


          <div class="form-group">

            <label for="crew-recovery-email">
              Email
            </label>

            <input
              class="crew-input"
              id="crew-recovery-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            >

          </div>


          <button
            class="crew-button primary crew-login-submit"
            id="crew-recovery-submit"
            type="submit"
          >
            Send Reset Link
          </button>


          <button
            id="crew-recovery-cancel"
            type="button"
            class="crew-login-recovery-link"
          >
            Back to sign in
          </button>

        </form>

      </div>


      <p class="crew-login-note">
        Cookie Crew access is restricted to authorized OBA staff.
      </p>

    </section>

  </main>


  <script>
    (() => {
      'use strict';


      /* =====================================
         CONFIG
      ====================================== */

      const API_BASE =
        'https://api.ollysbakedassortments.com';


      /* =====================================
         SIGN-IN ELEMENTS
      ====================================== */

      const form =
        document.getElementById(
          'crew-login-form'
        );

      const loginHeading =
        document.getElementById(
          'crew-login-heading'
        );

      const emailInput =
        document.getElementById(
          'crew-email'
        );

      const passwordInput =
        document.getElementById(
          'crew-password'
        );

      const submit =
        document.getElementById(
          'crew-login-submit'
        );

      const status =
        document.getElementById(
          'login-status'
        );


      /* =====================================
         RECOVERY ELEMENTS
      ====================================== */

      const forgotPasswordButton =
        document.getElementById(
          'crew-forgot-password'
        );

      const recoveryForm =
        document.getElementById(
          'crew-recovery-form'
        );

      const recoveryEmailInput =
        document.getElementById(
          'crew-recovery-email'
        );

      const recoverySubmit =
        document.getElementById(
          'crew-recovery-submit'
        );

      const recoveryCancel =
        document.getElementById(
          'crew-recovery-cancel'
        );

      const recoveryStatus =
        document.getElementById(
          'recovery-status'
        );


      /* =====================================
         STATUS HELPERS
      ====================================== */

      function showStatus(
        message,
        type = 'error'
      ) {
        status.textContent =
          message;

        status.className =
          `modal-status is-visible ${type}`;
      }


      function clearStatus() {
        status.textContent = '';

        status.className =
          'modal-status';
      }


      function showRecoveryStatus(
        message,
        type = 'success'
      ) {
        recoveryStatus.textContent =
          message;

        recoveryStatus.className =
          `modal-status is-visible ${type}`;
      }


      function clearRecoveryStatus() {
        recoveryStatus.textContent = '';

        recoveryStatus.className =
          'modal-status';
      }


      /* =====================================
         SESSION CHECK
      ====================================== */

      async function checkExistingSession() {

        try {

          const response =
            await fetch(
              `${API_BASE}/crew/session`,
              {
                method: 'GET',

                credentials: 'include',

                headers: {
                  'Accept':
                    'application/json'
                }
              }
            );


          const data =
            await response.json();


          if (
            response.ok &&
            data.ok === true &&
            data.authenticated === true
          ) {
            window.location.replace(
              '/crew/dashboard.html'
            );
          }


        } catch (error) {

          console.error(
            'Crew session check failed:',
            error
          );
        }
      }


      /* =====================================
         SIGN IN
      ====================================== */

      form.addEventListener(
        'submit',
        async event => {

          event.preventDefault();

          clearStatus();


          const email =
            emailInput.value.trim();

          const password =
            passwordInput.value;


          if (!email || !password) {

            showStatus(
              'Enter your Crew email and password.'
            );

            return;
          }


          submit.disabled = true;

          submit.textContent =
            'Signing In…';


          try {

            const response =
              await fetch(
                `${API_BASE}/crew/login`,
                {
                  method: 'POST',

                  credentials: 'include',

                  headers: {
                    'Content-Type':
                      'application/json',

                    'Accept':
                      'application/json'
                  },

                  body: JSON.stringify({
                    email,
                    password
                  })
                }
              );


            const data =
              await response.json();


            if (
              !response.ok ||
              data.ok !== true ||
              data.authenticated !== true
            ) {
              throw new Error(
                data.error ||
                'Unable to sign in.'
              );
            }


            showStatus(
              'Signed in. Opening Crew Operations…',
              'success'
            );


            passwordInput.value = '';


            window.location.replace(
              '/crew/dashboard.html'
            );


          } catch (error) {

            console.error(
              'Crew login failed:',
              error
            );


            showStatus(
              error.message ||
              'Unable to sign in.'
            );


          } finally {

            submit.disabled = false;

            submit.textContent =
              'Sign In';
          }
        }
      );


      /* =====================================
         OPEN PASSWORD RECOVERY
      ====================================== */

      forgotPasswordButton.addEventListener(
        'click',
        () => {

          clearStatus();
          clearRecoveryStatus();


          /*
           * Carry an already-entered email into
           * the recovery form.
           */
          recoveryEmailInput.value =
            emailInput.value.trim();


          loginHeading.hidden = true;

          form.hidden = true;

          forgotPasswordButton.hidden =
            true;

          recoveryForm.hidden = false;


          recoveryEmailInput.focus();
        }
      );


      /* =====================================
         RETURN TO SIGN IN
      ====================================== */

      recoveryCancel.addEventListener(
        'click',
        () => {

          clearRecoveryStatus();


          /*
           * Carry the recovery email back into
           * the normal sign-in form.
           */
          if (
            recoveryEmailInput.value.trim()
          ) {
            emailInput.value =
              recoveryEmailInput.value.trim();
          }


          recoveryForm.hidden = true;

          loginHeading.hidden = false;

          form.hidden = false;

          forgotPasswordButton.hidden =
            false;


          /*
           * Restore recovery controls in case
           * this screen was previously submitted.
           */
          recoveryEmailInput.disabled =
            false;

          recoverySubmit.hidden =
            false;

          recoverySubmit.disabled =
            false;

          recoverySubmit.textContent =
            'Send Reset Link';


          emailInput.focus();
        }
      );


      /* =====================================
         REQUEST PASSWORD RESET
      ====================================== */

      recoveryForm.addEventListener(
        'submit',
        async event => {

          event.preventDefault();

          clearRecoveryStatus();


          const email =
            recoveryEmailInput.value.trim();


          if (!email) {

            showRecoveryStatus(
              'Enter your Cookie Crew email.',
              'error'
            );

            return;
          }


          recoverySubmit.disabled = true;

          recoverySubmit.textContent =
            'Sending…';


          try {

            const response =
              await fetch(
                `${API_BASE}/crew/forgot-password`,
                {
                  method: 'POST',

                  credentials: 'include',

                  headers: {
                    'Content-Type':
                      'application/json',

                    'Accept':
                      'application/json'
                  },

                  body: JSON.stringify({
                    email
                  })
                }
              );


            const data =
              await response.json();


            if (
              !response.ok ||
              data.ok !== true
            ) {
              throw new Error(
                data.error ||
                'Unable to request a password reset.'
              );
            }


            /*
             * The API deliberately returns the
             * same public response regardless of
             * whether an account exists.
             */
            showRecoveryStatus(
              data.message ||
                'If that email belongs to an active Cookie Crew account, password reset instructions will be sent.',
              'success'
            );


            recoveryEmailInput.disabled =
              true;

            recoverySubmit.hidden =
              true;


          } catch (error) {

            console.error(
              'Crew password recovery failed:',
              error
            );


            showRecoveryStatus(
              error.message ||
                'Unable to request a password reset.',
              'error'
            );


          } finally {

            if (
              !recoverySubmit.hidden
            ) {
              recoverySubmit.disabled =
                false;

              recoverySubmit.textContent =
                'Send Reset Link';
            }
          }
        }
      );


      /* =====================================
         SUCCESSFUL RESET RETURN
      ====================================== */

      const pageParams =
        new URLSearchParams(
          window.location.search
        );


      if (
        pageParams.get(
          'password-reset'
        ) === 'success'
      ) {

        showStatus(
          'Password reset successfully. Sign in with your new password.',
          'success'
        );


        window.history.replaceState(
          {},
          document.title,
          '/crew/crew-login.html'
        );
      }


      if (
        pageParams.get(
          'account-recovered'
        ) === 'success'
      ) {

        showStatus(
          'Account recovered successfully. Sign in with your new password.',
          'success'
        );

        window.history.replaceState(
          {},
          document.title,
          '/crew/crew-login.html'
        );
      }


      /* =====================================
         INITIALIZE
      ====================================== */

      checkExistingSession();

    })();
  </script>

</body>
</html>
