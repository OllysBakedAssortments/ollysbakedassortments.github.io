<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Reset Password | OBA Cookie Crew</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

  <link
    rel="stylesheet"
    href="/crew/crew.css"
  >
</head>

<body>

  <main class="crew-login-page">

    <section
      class="crew-login-card"
      aria-labelledby="reset-password-title"
    >

      <div class="crew-login-brand">

        <img
          src="/images/brand/logo.png"
          alt="OBA Cookies"
        >

        <div>
          <p class="crew-login-eyebrow">
            COOKIE CREW
          </p>

          <h1 id="reset-password-title">
            Reset your password
          </h1>
        </div>

      </div>


      <p class="crew-login-intro">
        Enter a new password for your Cookie Crew account.
      </p>


      <div
        id="reset-status"
        class="crew-login-message"
        role="status"
        aria-live="polite"
        hidden
      ></div>


      <form id="reset-password-form">

        <label for="new-password">
          New password
        </label>

        <input
          id="new-password"
          name="newPassword"
          type="password"
          minlength="12"
          autocomplete="new-password"
          required
        >


        <label for="confirm-password">
          Confirm new password
        </label>

        <input
          id="confirm-password"
          name="confirmPassword"
          type="password"
          minlength="12"
          autocomplete="new-password"
          required
        >


        <p class="crew-login-help">
          Passwords must be at least 12 characters.
        </p>


        <button
          id="reset-password-button"
          type="submit"
          class="crew-login-submit"
        >
          Reset Password
        </button>

      </form>


      <p class="crew-login-help">
        <a href="/crew/crew-login.html">
          Back to Cookie Crew sign in
        </a>
      </p>

    </section>

  </main>


  <script>
    (() => {
      'use strict';

      const API_BASE =
        'https://api.ollysbakedassortments.com';

      const form =
        document.getElementById(
          'reset-password-form'
        );

      const newPasswordInput =
        document.getElementById(
          'new-password'
        );

      const confirmPasswordInput =
        document.getElementById(
          'confirm-password'
        );

      const submitButton =
        document.getElementById(
          'reset-password-button'
        );

      const statusElement =
        document.getElementById(
          'reset-status'
        );


      const params =
        new URLSearchParams(
          window.location.search
        );

      const resetToken =
        params.get('token')?.trim() || '';


      function showStatus(
        message,
        isError = false
      ) {
        statusElement.hidden = false;

        statusElement.textContent =
          message;

        statusElement.dataset.state =
          isError
            ? 'error'
            : 'success';
      }


      if (!resetToken) {
        form.hidden = true;

        showStatus(
          'This password reset link is invalid. Request a new password reset from the Cookie Crew sign-in page.',
          true
        );

        return;
      }


      form.addEventListener(
        'submit',
        async event => {

          event.preventDefault();


          const newPassword =
            newPasswordInput.value;

          const confirmPassword =
            confirmPasswordInput.value;


          if (newPassword.length < 12) {
            showStatus(
              'Your new password must be at least 12 characters.',
              true
            );

            return;
          }


          if (
            newPassword !==
            confirmPassword
          ) {
            showStatus(
              'The passwords do not match.',
              true
            );

            return;
          }


          submitButton.disabled = true;
          submitButton.textContent =
            'Resetting…';


          try {

            const response =
              await fetch(
                `${API_BASE}/crew/reset-password`,
                {
                  method: 'POST',

                  credentials: 'include',

                  headers: {
                    'Content-Type':
                      'application/json',

                    'Accept':
                      'application/json'
                  },

                  body: JSON.stringify({
                    token:
                      resetToken,

                    newPassword
                  })
                }
              );


            const data =
              await response.json();


            if (
              !response.ok ||
              data.ok !== true ||
              data.passwordReset !== true
            ) {
              showStatus(
                data.error ||
                  'Unable to reset password.',
                true
              );

              submitButton.disabled = false;
              submitButton.textContent =
                'Reset Password';

              return;
            }


            /*
             * Remove the sensitive reset token
             * from the browser address bar.
             */
            window.history.replaceState(
              {},
              document.title,
              '/crew/reset-password.html'
            );


            form.hidden = true;


            showStatus(
              'Password reset successfully. Redirecting you to Cookie Crew sign in…'
            );


            window.setTimeout(
              () => {
                window.location.replace(
                  '/crew/crew-login.html?password-reset=success'
                );
              },
              1500
            );


          } catch (error) {

            console.error(
              'Crew password reset failed:',
              error
            );

            showStatus(
              'Unable to connect to Cookie Crew. Please try again.',
              true
            );

            submitButton.disabled = false;
            submitButton.textContent =
              'Reset Password';
          }
        }
      );

    })();
  </script>

</body>
</html>
