<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Crew Access | OBA Cookie Crew</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/crew/crew.css">
  <style>
    .access-list{display:grid;gap:14px}.access-member{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px;border:1px solid rgba(91,58,41,.16);border-radius:16px;background:#fff}.access-name{margin:0 0 5px;font-size:1.08rem;color:#5b2a12}.access-meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:#806b5e;font-size:.9rem}.access-role{text-transform:capitalize}.access-message{margin:0 0 18px;padding:13px 15px;border-radius:13px;background:#edf7e9;color:#315c2d}.access-message.error{background:#fff0ed;color:#8b2f25}.access-empty{padding:24px;border:1px dashed rgba(91,58,41,.22);border-radius:16px;color:#806b5e;text-align:center}@media(max-width:720px){.access-member{grid-template-columns:1fr}.access-member .crew-button{width:100%}}
  </style>
</head>
<body>
  <div class="crew-app">
    <div data-crew-sidebar></div>
    <div data-crew-mobile-bar></div>

    <main class="crew-main">
      <header class="crew-page-header">
        <div>
          <p class="crew-eyebrow">COOKIE CREW · SECURITY</p>
          <h1>Crew Access</h1>
          <p>Manage account recovery for authorized OBA staff.</p>
        </div>
        <div class="crew-header-actions">
          <a class="crew-button soft" href="/crew/dashboard.html">Command Center</a>
        </div>
      </header>

      <div id="accessStatus" class="access-message" hidden></div>

      <section class="crew-card">
        <div class="crew-card-heading">
          <div>
            <p class="crew-eyebrow">STAFF ACCOUNTS</p>
            <h2>Crew Directory</h2>
            <p>Owners can send recovery invitations to Managers and Crew. Managers can recover Crew accounts only.</p>
          </div>
        </div>
        <div id="crewList" class="access-list" aria-live="polite">
          <div class="access-empty">Loading Crew accounts…</div>
        </div>
      </section>
    </main>
  </div>

  <script src="/crew/crew-auth.js"></script>
  <script src="/crew/crew-shell.js"></script>
  <script>
    (() => {
      'use strict';
      const API_BASE = 'https://api.ollysbakedassortments.com';
      const list = document.getElementById('crewList');
      const status = document.getElementById('accessStatus');

      function esc(value) {
        return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
      }

      function showStatus(message, isError = false) {
        status.hidden = false;
        status.className = `access-message${isError ? ' error' : ''}`;
        status.textContent = message;
      }

      function fullName(user) {
        return [user.firstName, user.lastName].filter(Boolean).join(' ') || user.email;
      }

      function render(users) {
        if (!users.length) {
          list.innerHTML = '<div class="access-empty">No Crew accounts found.</div>';
          return;
        }

        list.innerHTML = users.map(user => `
          <article class="access-member">
            <div>
              <h3 class="access-name">${esc(fullName(user))}</h3>
              <div class="access-meta">
                <span>${esc(user.email)}</span>
                <span class="access-role">${esc(user.role)}</span>
                <span>${esc(user.status)}</span>
                ${user.lastLoginAt ? `<span>Last sign-in: ${esc(new Date(user.lastLoginAt.replace(' ', 'T') + 'Z').toLocaleString())}</span>` : '<span>Never signed in</span>'}
              </div>
            </div>
            ${user.canRecover ? `<button class="crew-button soft" type="button" data-recover-id="${user.crewUserId}" data-recover-name="${esc(fullName(user))}">Send Recovery Link</button>` : ''}
          </article>
        `).join('');
      }

      async function loadUsers() {
        const response = await fetch(`${API_BASE}/crew/users`, {
          method: 'GET', credentials: 'include', headers: {'Accept':'application/json'}
        });
        const data = await response.json();
        if (!response.ok || data.ok !== true) throw new Error(data.error || 'Unable to load Crew accounts.');
        render(data.users || []);
      }

      list.addEventListener('click', async event => {
        const button = event.target.closest('[data-recover-id]');
        if (!button) return;
        const name = button.dataset.recoverName || 'this Crew member';
        if (!window.confirm(`Send a one-use recovery link to ${name}? This will revoke any older unused password-reset link for that account.`)) return;

        button.disabled = true;
        const oldText = button.textContent;
        button.textContent = 'Sending…';
        status.hidden = true;
        try {
          const response = await fetch(`${API_BASE}/crew/admin-recovery`, {
            method: 'POST', credentials: 'include',
            headers: {'Content-Type':'application/json','Accept':'application/json'},
            body: JSON.stringify({crewUserId: Number(button.dataset.recoverId)})
          });
          const data = await response.json();
          if (!response.ok || data.ok !== true) throw new Error(data.error || 'Unable to send recovery invitation.');
          showStatus(`Recovery invitation sent to ${name}. The link expires in 30 minutes and can only be used once.`);
        } catch (error) {
          showStatus(error instanceof Error ? error.message : 'Unable to send recovery invitation.', true);
        } finally {
          button.disabled = false;
          button.textContent = oldText;
        }
      });

      async function init() {
        try {
          const session = await window.OBA_CREW_AUTH.requireCrewSession();
          if (!session) return;
          const role = String(session.user?.role || '').toLowerCase();
          if (!['owner','manager'].includes(role)) {
            window.location.replace('/crew/dashboard.html');
            return;
          }
          window.OBA_CREW_SHELL.mount({activePage:'crewAccess'});
          window.OBA_CREW_SHELL.renderCrewIdentity(session);
          await loadUsers();
        } catch (error) {
          showStatus(error instanceof Error ? error.message : 'Unable to load Crew Access.', true);
          list.innerHTML = '<div class="access-empty">Crew accounts could not be loaded.</div>';
        }
      }
      init();
    })();
  </script>
</body>
</html>
