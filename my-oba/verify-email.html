<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/longneck.css"><title>Verify Email | OBA Cookies</title></head><body class="longneck-body"><main class="auth-wrap"><section class="auth-card"><span class="passport-kicker">Email verification</span><h1 id="title">Verifying your email…</h1><p id="copy">One moment, Longneck.</p><div id="msg" hidden></div><a class="ln-button" href="/my-oba/" id="go" hidden>Open My OBA</a></section></main><script src="/js/longneck-auth.js"></script><script>(async()=>{try{const token=new URLSearchParams(location.search).get('token');await OBA_LONGNECK.api('/longneck/verify-email',{method:'POST',body:JSON.stringify({token})});title.textContent='Email verified.';copy.textContent='Your Longneck Passport is ready.';go.hidden=false}catch(x){title.textContent='We could not verify that link.';copy.textContent=x.message}})();</script></body></html>
