<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/longneck.css"><title>Longneck Login | OBA Cookies</title></head><body class="longneck-body"><main class="auth-wrap"><section class="auth-card"><span class="passport-kicker">My OBA · Longneck Passport</span><h1>Welcome back, Longneck.</h1><p>Sign in to your OBA passport, Chips, Faves and adventures.</p><div id="msg" hidden></div><form id="form"><div class="auth-field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="auth-field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="ln-button full-button">Sign in</button></form><div class="auth-links"><a href="/my-oba/create-account.html">Create a Longneck account</a><a href="/my-oba/forgot-password.html">Forgot password?</a></div></section></main><script src="/js/longneck-auth.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');try{await OBA_LONGNECK.api('/longneck/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});const n=new URLSearchParams(location.search).get('next');location.href=n&&n.startsWith('/')?n:'/my-oba/'}catch(x){OBA_LONGNECK.message(m,x.message,true)}});</script></body></html>
