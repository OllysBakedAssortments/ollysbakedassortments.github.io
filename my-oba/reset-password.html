<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/longneck.css"><title>Reset Password | OBA Cookies</title></head><body class="longneck-body"><main class="auth-wrap"><section class="auth-card"><span class="passport-kicker">Account recovery</span><h1>Choose a new password.</h1><div id="msg" hidden></div><form id="form"><div class="auth-field"><label>New password</label><input id="password" type="password" minlength="10" required></div><button class="ln-button full-button">Update password</button></form></section></main><script src="/js/longneck-auth.js"></script><script>form.addEventListener('submit',async e=>{e.preventDefault();try{const token=new URLSearchParams(location.search).get('token');await OBA_LONGNECK.api('/longneck/reset-password',{method:'POST',body:JSON.stringify({token,password:password.value})});location.href='/my-oba/login.html'}catch(x){OBA_LONGNECK.message(msg,x.message,true)}});</script></body></html>
