<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/longneck.css"><title>Create Longneck Account | OBA Cookies</title></head><body class="longneck-body"><main class="auth-wrap"><section class="auth-card"><span class="passport-kicker">Join the herd</span><h1>Create your Longneck Passport.</h1><p>Longneck Accounts are currently available to guests age 18 and older.</p><div id="msg" hidden></div><form id="form"><div class="auth-row"><div class="auth-field"><label>First name</label><input id="firstName" required></div><div class="auth-field"><label>Last name</label><input id="lastName" required></div></div><div class="auth-field"><label>Display name</label><input id="displayName" maxlength="60" required><small>Shown publicly when community features are active.</small></div><div class="auth-field"><label>Username</label><input id="username" maxlength="24" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,23}" placeholder="@yourhandle" required></div><div class="auth-field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="auth-field"><label>Password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required></div><label class="auth-check"><input id="adult" type="checkbox" required><span>I confirm that I am 18 or older.</span></label><button class="ln-button full-button">Create my passport</button></form><div class="auth-links"><a href="/my-oba/login.html">Already a Longneck? Sign in</a></div></section></main><script src="/js/longneck-auth.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');try{await OBA_LONGNECK.api('/longneck/register',{method:'POST',body:JSON.stringify({firstName:firstName.value,lastName:lastName.value,displayName:displayName.value,username:username.value,email:email.value,password:password.value,confirmAdult:adult.checked})});location.href='/my-oba/?welcome=1'}catch(x){OBA_LONGNECK.message(m,x.message,true)}});</script></body></html>
