<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/longneck.css"><title>Recover Longneck Account | OBA Cookies</title></head><body class="longneck-body"><main class="auth-wrap"><section class="auth-card"><span class="passport-kicker">Account recovery</span><h1>Reset your password.</h1><p>Enter the email connected to your Longneck account.</p><div id="msg" hidden></div><form id="form"><div class="auth-field"><label>Email</label><input id="email" type="email" required></div><button class="ln-button full-button">Send reset link</button></form><div class="auth-links"><a href="/my-oba/login.html">Back to login</a></div></section></main><script src="/js/longneck-auth.js"></script><script>form.addEventListener('submit',async e=>{e.preventDefault();try{const d=await OBA_LONGNECK.api('/longneck/request-reset',{method:'POST',body:JSON.stringify({email:email.value})});OBA_LONGNECK.message(msg,d.message)}catch(x){OBA_LONGNECK.message(msg,x.message,true)}});</script></body></html>
